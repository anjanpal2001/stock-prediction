name: Full ML CI/CD Pipeline to Amazon Linux EC2, Docker & S3

on:
  push:
    branches:
      - main

jobs:
  train-build-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Set up Docker Buildx for container building
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. Build and Push Docker Image
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/finagent-app:latest

      # 5. Deploy Container to Amazon Linux EC2 via SSH
      - name: Deploy to Amazon Linux EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_PASS: ${{ secrets.DOCKERHUB_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DOCKER_USER,DOCKER_PASS,GROQ_API_KEY,S3_BUCKET_NAME,AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,AWS_REGION
          script: |
            # 1. Ensure Docker service is running on Amazon Linux
            sudo systemctl start docker

            # 2. Authenticate to Docker Hub inside EC2
            echo "$DOCKER_PASS" | sudo docker login -u "$DOCKER_USER" --password-stdin

            # 3. Stop and delete old container if running
            sudo docker stop finagent-container || true
            sudo docker rm finagent-container || true

            # 4. Pull the fresh image from Docker Hub
            sudo docker pull $DOCKER_USER/finagent-app:latest

            # 5. Run new container with all runtime environment variables injected
            sudo docker run -d \
              --restart always \
              --name finagent-container \
              -p 8000:8000 \
              -e GROQ_API_KEY="$GROQ_API_KEY" \
              -e S3_BUCKET_NAME="$S3_BUCKET_NAME" \
              -e AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID" \
              -e AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY" \
              -e AWS_REGION="$AWS_REGION" \
              $DOCKER_USER/finagent-app:latest

            # 6. Clean dangling images to conserve EC2 disk storage
            sudo docker image prune -f